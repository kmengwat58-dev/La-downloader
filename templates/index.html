<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaSaver Pro - ទាញយកវីដេអូ HD</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Modern Reset & Responsive Core */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Responsive Container */
        .wrapper {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Section */
        header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
            font-weight: 700;
            color: #6366f1;
            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        p.subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.05rem);
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto 20px;
            line-height: 1.5;
        }

        /* Platform Badges Container */
        .badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #cbd5e1;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(5px);
        }

        /* Main Download Box Card */
        .download-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            padding: 24px 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            color: #0f172a;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .btn-download {
            width: 100%;
            padding: 15px 24px;
            background: #4f46e5;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        /* Features Section Grid */
        .features {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            width: 100%;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .feature-icon {
            font-size: 2rem;
            color: #818cf8;
            margin-bottom: 10px;
        }

        .feature-card h3 {
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .feature-card p {
            font-size: 0.88rem;
            color: #94a3b8;
        }

        /* Loading & Results */
        #loading {
            display: none;
            margin-top: 18px;
            color: #4f46e5;
            font-weight: 600;
            text-align: center;
        }

        #result {
            margin-top: 18px;
            text-align: center;
        }

        .download-btn-success {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .download-btn-success:hover {
            background: #059669;
        }

        /* Desktop & Tablet Optimization (Screens wider than 640px) */
        @media (min-width: 640px) {
            .wrapper {
                padding: 40px 20px;
            }
            .input-group {
                flex-direction: row;
            }
            .btn-download {
                width: auto;
                min-width: 150px;
            }
            .features {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <div class="logo">
                <i class="fa-solid fa-circle-down"></i> MediaSaver Pro
            </div>
            <h1>ទាញយកវីដេអូ HD ឥតគិតថ្លៃ</h1>
            <p class="subtitle">ទាញយកវីដេអូពី YouTube, TikTok, Facebook Reels និង Instagram ដោយគ្មាន Watermark</p>
            
            <div class="badges">
                <span class="badge"><i class="fa-brands fa-youtube" style="color: #ef4444;"></i> YouTube</span>
                <span class="badge"><i class="fa-brands fa-tiktok"></i> TikTok</span>
                <span class="badge"><i class="fa-brands fa-facebook" style="color: #3b82f6;"></i> Reels</span>
                <span class="badge"><i class="fa-brands fa-instagram" style="color: #ec4899;"></i> Instagram</span>
            </div>
        </header>

        <div class="download-box">
            <form id="downloadForm" onsubmit="handleDownload(event)">
                <div class="input-group">
                    <input type="text" id="videoUrl" placeholder="បិទភ្ជាប់ Link វីដេអូនៅទីនេះ..." required autocomplete="off">
                    <button type="submit" class="btn-download">
                        <i class="fa-solid fa-download"></i> ទាញយក
                    </button>
                </div>
            </form>

            <div id="loading">
                <i class="fa-solid fa-spinner fa-spin"></i> កំពុងរៀបចំការទាញយក...
            </div>

            <div id="result"></div>
        </div>

        <div class="features">
            <div class="feature-card">
                <div class="feature-icon"><i class="fa-solid fa-bolt"></i></div>
                <h3>ល្បឿនលឿន</h3>
                <p>ទាញយកវីដេអូបានក្នុងរយៈពេលប៉ុន្មានវិនាទី</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <h3>សុវត្ថិភាព ១០០%</h3>
                <p>គ្មានការផ្ទុកទិន្នន័យផ្ទាល់ខ្លួន ឬមេរោគឡើយ</p>
            </div>
        </div>
    </div>

    <script>
        function handleDownload(e) {
            e.preventDefault();
            const url = document.getElementById('videoUrl').value;
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            loading.style.display = 'block';
            result.innerHTML = '';

            fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'url=' + encodeURIComponent(url)
            })
            .then(res => res.json())
            .then(data => {
                loading.style.display = 'none';
                if(data.status === 'success') {
                    result.innerHTML = `
                        <p style="color: #10b981; font-weight:600; margin-bottom:8px;">${data.title || 'រៀបចំរួចរាល់!'}</p>
                        <a href="${data.url}" class="download-btn-success" target="_blank"><i class="fa-solid fa-file-arrow-down"></i> ចុចទីនេះដើម្បី Save វីដេអូ</a>
                    `;
                } else {
                    result.innerHTML = `<p style="color: #ef4444; font-weight:500;">${data.message || 'មានបញ្ហា! សូមពិនិត្យ Link ឡើងវិញ'}</p>`;
                }
            })
            .catch(() => {
                loading.style.display = 'none';
                result.innerHTML = `<p style="color: #ef4444; font-weight:500;">មានបញ្ហាក្នុងការតភ្ជាប់ទៅ Server!</p>`;
            });
        }
    </script>
</body>
</html>
